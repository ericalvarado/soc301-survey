<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Comic Sans MS', 'Comic Neue', Arial, sans-serif">
  <rect width="800" height="500" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">How much do students sleep? (8 hours is recommended)</text>
  <defs>
    <!-- a stick figure lying in bed; origin = bed top-left -->
    <g id="sleeper" stroke="#111" stroke-width="3" fill="none" stroke-linecap="round">
      <rect x="0" y="0" width="130" height="34" rx="4" fill="#dbeafe"/>
      <line x1="0" y1="34" x2="0" y2="52"/><line x1="130" y1="34" x2="130" y2="52"/>
      <circle cx="18" cy="-8" r="12" fill="#fff"/>
      <line x1="30" y1="-4" x2="100" y2="-4"/>
    </g>
  </defs>
  <g stroke="#111" stroke-width="4" fill="#fff">
    <rect x="20" y="56" width="180" height="420" rx="6"/>
    <rect x="215" y="56" width="180" height="420" rx="6"/>
    <rect x="410" y="56" width="180" height="420" rx="6"/>
    <rect x="605" y="56" width="180" height="420" rx="6"/>
  </g>
  <!-- speech bubbles -->
  <g stroke="#111" stroke-width="2.5" fill="#fff">
    <rect x="34" y="74" width="152" height="96" rx="18"/><polygon points="70,170 92,170 72,196"/>
    <rect x="229" y="74" width="152" height="96" rx="18"/><polygon points="265,170 287,170 267,196"/>
    <rect x="424" y="74" width="152" height="96" rx="18"/><polygon points="460,170 482,170 462,196"/>
    <rect x="619" y="74" width="152" height="96" rx="18"/><polygon points="655,170 677,170 657,196"/>
  </g>
  <g font-size="17" text-anchor="middle" fill="#111">
    <text x="110" y="108">Freshman year:</text><text x="110" y="140" font-size="26" font-weight="bold">7.2 h</text>
    <text x="305" y="108">Sophomore:</text><text x="305" y="140" font-size="26" font-weight="bold">6.9 h</text>
    <text x="500" y="108">Junior:</text><text x="500" y="140" font-size="26" font-weight="bold">6.5 h</text>
    <text x="695" y="108">Senior:</text><text x="695" y="140" font-size="26" font-weight="bold" fill="#dc2626">6.1 h</text>
  </g>
  <use href="#sleeper" x="45" y="300"/>
  <use href="#sleeper" x="240" y="300"/>
  <use href="#sleeper" x="435" y="300"/>
  <use href="#sleeper" x="630" y="300"/>
  <!-- Zzz shrink each year -->
  <g fill="#3b82f6" font-weight="bold">
    <text x="70" y="270" font-size="40">Z</text><text x="105" y="245" font-size="34">Z</text><text x="135" y="222" font-size="28">Z</text><text x="160" y="204" font-size="22">z</text>
    <text x="265" y="270" font-size="40">Z</text><text x="300" y="245" font-size="34">Z</text><text x="330" y="222" font-size="28">z</text>
    <text x="460" y="270" font-size="40">Z</text><text x="495" y="245" font-size="30">z</text>
    <text x="655" y="270" font-size="34">z</text>
  </g>
  <g font-size="15" text-anchor="middle" fill="#374151">
    <text x="110" y="400">Pretty rested</text>
    <text x="305" y="400">A bit less…</text>
    <text x="500" y="400">Even less…</text>
    <text x="695" y="400">Still 2 h short</text>
    <text x="695" y="420">of 8!</text>
  </g>
  <text x="785" y="494" font-size="12" fill="#9ca3af" text-anchor="end" font-family="Arial, sans-serif">PLACEHOLDER: replace with your chart</text>
</svg>
